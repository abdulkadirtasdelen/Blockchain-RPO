let lang='tr';try{const s=localStorage.getItem('merkle-lang');if(s==='en'||s==='tr')lang=s;}catch(e){}
const T=(k,...a)=>{const v=I18N[lang][k];return typeof v==='function'?v(...a):v;};
const LOC=()=>lang==='tr'?'tr-TR':'en-US';
const NAMES=['Ali','Ayşe','Burak','Ceren','Deniz','Elif','Fatih','Gizem','Hakan','Irmak','Kerem','Leyla','Mert','Nil','Onur','Pelin','Rüzgar'];
const AMT=[5,2,7,1,3,9,4,6,8,2,5,1,3,7,6,4];
const mkTx=n=>Array.from({length:n},(_,i)=>`Tx${i+1}: ${NAMES[i]} → ${NAMES[i+1]} ${AMT[i]} BTC`);
const short=h=>h.slice(0,6)+'…';
const SVGNS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let n=8,orig=mkTx(8),texts=orig.slice(),sel=2;

function build(tx){
  const levels=[];let cur=tx.map((t,i)=>({h:sha256(t),label:'H'+(i+1),lo:i+1,hi:i+1,dup:false,leaf:true}));
  while(true){
    if(cur.length>1&&cur.length%2){const o=cur[cur.length-1];cur.push({h:o.h,label:T('copy'),lo:o.lo,hi:o.hi,dup:true,of:o});}
    levels.push(cur);if(cur.length===1)break;
    const nx=[];for(let i=0;i<cur.length;i+=2){const a=cur[i],b=cur[i+1];const hi=b.dup?a.hi:b.hi;
      nx.push({h:sha256(a.h+b.h),lo:a.lo,hi,label:hi>a.lo?`H${a.lo}–${hi}`:`H${a.lo}+k`,kids:[a,b]});}
    cur=nx;
  }
  levels[levels.length-1][0].label=T('root');
  return levels;
}
function render(){
  const lv=build(texts),ov=build(orig);const R=lv.length;
  const W=n>8?86:104,RH=78,PAD=10,NW=W-12,NH=44;
  lv.forEach((arr,L)=>arr.forEach((nd,i)=>{
    if(L===0)nd.x=(i+.5)*W;else if(nd.kids)nd.x=(nd.kids[0].x+nd.kids[1].x)/2;
    nd.y=PAD+(R-1-L)*RH;nd.L=L;nd.i=i;nd.chg=nd.h!==ov[L][i].h;}));
  lv.forEach(arr=>arr.forEach((nd,i)=>{if(nd.dup&&nd.L>0)nd.x=arr[i-1].x+(arr[1].x-arr[0].x);}));
  const pr=[];{let idx=sel;for(let L=0;L<R-1;L++){pr.push({L,idx,sib:lv[L][idx^1],left:idx%2===0});idx>>=1;}}
  const pathSet=new Set(),proofSet=new Set();
  {let idx=sel;for(let L=0;L<R;L++){pathSet.add(lv[L][idx]);idx>>=1;}}
  pr.forEach(p=>{if(!pathSet.has(p.sib))proofSet.add(p.sib);});
  const svg=$('tree');svg.innerHTML='';
  const width=lv[0].length*W,height=PAD+(R-1)*RH+NH+30;
  svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('width',width);svg.setAttribute('height',height);
  const el=(t,a,p)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
  lv.forEach(arr=>arr.forEach(nd=>{if(!nd.kids)return;nd.kids.forEach(k=>{
    const pe=pathSet.has(nd)&&pathSet.has(k);
    el('path',{class:'e'+(k.dup?' dupe':'')+(pe?' pe':''),d:`M${nd.x} ${nd.y+NH} C ${nd.x} ${nd.y+NH+18}, ${k.x} ${k.y-18}, ${k.x} ${k.y}`});});}));
  lv.forEach(arr=>arr.forEach(nd=>{
    let c='n';if(nd.dup)c+=' dup';if(nd.leaf&&!nd.dup)c+=' leaf';
    if(pathSet.has(nd))c+=' path';else if(proofSet.has(nd))c+=' proof';
    if(nd.chg)c+=' chg';
    const g=el('g',{class:c});
    el('rect',{x:nd.x-NW/2,y:nd.y,width:NW,height:NH,rx:7},g);
    el('text',{x:nd.x,y:nd.y+18,'text-anchor':'middle',class:'lb'},g).textContent=nd.label;
    el('text',{x:nd.x,y:nd.y+34,'text-anchor':'middle',class:'hs'},g).textContent=short(nd.h);
    if(nd.leaf&&!nd.dup){
      const i=nd.i;g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',T('pick',i+1));
      g.addEventListener('click',()=>{sel=i;render();});
      g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel=i;render();}});
      el('text',{x:nd.x,y:nd.y+NH+18,'text-anchor':'middle',class:'txl'+(i===sel?' sel':'')},svg).textContent='Tx'+(i+1);
    }
  }));
  const oroot=ov[R-1][0].h,nroot=lv[R-1][0].h;
  $('hdr').innerHTML=T('hdr',oroot)+(nroot!==oroot?T('hdrNew',nroot):'');
  const st=$('steps');st.innerHTML='';
  $('ptitle').textContent=T('stepsT',sel+1);
  let h=sha256(texts[sel]);
  const li=html=>{const x=document.createElement('li');x.innerHTML=html;st.appendChild(x);};
  li(T('step1',sel+1,esc(texts[sel]),short(h)));
  pr.forEach((p,k)=>{
    const sname=p.sib.dup?T('sibCopy',p.sib.of?p.sib.of.label:''):p.sib.label;
    const nh=p.left?sha256(h+p.sib.h):sha256(p.sib.h+h);
    const parent=lv[p.L+1][p.idx>>1];
    li(T('stepN',k+2,sname,p.left,parent.label,p.left?'h ‖ '+short(p.sib.h):short(p.sib.h)+' ‖ h',short(nh)));
    h=nh;
  });
  const v=$('verdict');
  if(h===oroot){v.className='verdict ok';v.textContent=T('vOk',sel+1);}
  else{v.className='verdict bad';v.textContent=T('vBad',short(h),short(oroot));}
  const inp=$('txedit');if(document.activeElement!==inp)inp.value=texts[sel];
  const ch=[];lv.forEach(a=>a.forEach(nd=>{if(nd.chg&&!nd.dup)ch.push(nd.label);}));
  $('tamperinfo').innerHTML=ch.length?T('tChg',ch.length,ch.join(', ')):T('tNone');
  $('cost').innerHTML=T('cost',n,pr.length);
}
$('txedit').addEventListener('input',e=>{texts[sel]=e.target.value;render();});
$('reset').addEventListener('click',()=>{texts=orig.slice();render();});
document.querySelectorAll('#nseg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#nseg button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');
  n=+b.dataset.n;orig=mkTx(n);texts=orig.slice();sel=Math.min(2,n-1);render();}));

function renderScale(){
  const L=LOC();const f1=x=>x.toLocaleString(L,{maximumFractionDigits:1});
  const fmt=b=>b>=1e9?f1(b/1e9)+' GB':b>=1e6?f1(b/1e6)+' MB':b>=1e3?f1(b/1e3)+' KB':b+' B';
  const tb=$('scale');tb.innerHTML='';
  [[8,''],[1024,''],[3000,T('typical')],[1e6,''],[1e9,'']].forEach(([m,t])=>{
    const k=Math.ceil(Math.log2(m));const tr=document.createElement('tr');
    tr.innerHTML=`<td>${m.toLocaleString(L)}<span class="note">${t}</span></td><td class="hi">${k}</td><td>${fmt(k*32)}</td><td>${fmt(m*32)}</td><td>${Math.round(m/k).toLocaleString(L)}×</td>`;
    tb.appendChild(tr);});
}

/* ---------- Real Bitcoin: Electrum JSON ---------- */
const B100K_ROOT='f3e94742aca4b5ef85488dc37c06c3282295ffec960994b2c0d5ac2a25a95766';
$('jtx').value='6359f0868171b1d194cbee1af2f16ea598ae8fad666d9b012c8ed2b79a236ec4';
$('jjson').value=JSON.stringify({block_height:100000,pos:2,merkle:['e9a66845e05d5abc0ad04ec80f774a7e585c6e8db975962d069a522137b80c1d','ccdafb73d8dcd0173d5d5c3c9a0770d0b3953db889dab99ef05b1907518cb815']},null,2);
$('jroot').value=B100K_ROOT;
function renderJson(){
  const st=$('jsteps'),v=$('jverdict');st.innerHTML='';
  const li=h=>{const x=document.createElement('li');x.innerHTML=h;st.appendChild(x);};
  try{
    const j=JSON.parse($('jjson').value);const pos=+j.pos;const list=j.merkle;
    if(!Array.isArray(list)||!(pos>=0))throw new Error('pos / merkle');
    const tx=$('jtx').value.trim().toLowerCase();if(!/^[0-9a-f]{64}$/.test(tx))throw new Error('txid');
    let h=revU(fromHex(tx));li(T('jStart',short(tx)));
    list.forEach((s,i)=>{const sib=revU(fromHex(s));if(sib.length!==32)throw new Error('hash '+(i+1));
      const bit=(pos>>i)&1,left=bit===0;h=left?sha256d(cat(h,sib)):sha256d(cat(sib,h));
      li(T('jStep',i+1,bit,left,short(s),short(toHex(revU(h)))));});
    const root=toHex(revU(h));const want=$('jroot').value.trim().toLowerCase();
    if(root===want){v.className='verdict ok';v.textContent=T('jOk');}else{v.className='verdict bad';v.textContent=T('jBad')+' ('+short(root)+' ≠ '+short(want)+')';}
  }catch(e){v.className='verdict bad';v.textContent=T('jErr',e.message);}
}
['jtx','jjson','jroot'].forEach(id=>$(id).addEventListener('input',renderJson));

/* ---------- Real Bitcoin: gettxoutproof hex ---------- */
$('hexin').value='0100000050120119172a610421a6c3011dd330d9df07b63616c2cc1f1cd00200000000006657a9252aacd5c0b2940996ecff952228c3067cc38d4885efb5a4ac4247e9f337221b4d4c86041b0f2b5710040000000315b88c5107195bf09eb9da89b83d95b3d070079a3c5c5d3d17d0dcd873fbdaccc46e239ab7d28e2c019b6d66ad8fae98a56ef1f21aeecb94d1b1718186f059631d0cb83721529a062d9675b98d6e5c587e4a770fc84ed00abc5a5de04568a6e9010d';
function readVarint(u,o){const b=u[o];if(b<0xfd)return[b,1];const dv=new DataView(u.buffer,u.byteOffset);if(b===0xfd)return[dv.getUint16(o+1,true),3];if(b===0xfe)return[dv.getUint32(o+1,true),5];throw new Error('varint')}
function renderHex(){
  const fields=$('fields'),trav=$('trav'),v=$('hverdict'),view=$('hexview');
  fields.innerHTML='';trav.innerHTML='';view.innerHTML='';
  $('hexlegend').innerHTML=[['sg-h','sgH'],['sg-n','sgN'],['sg-c','sgC'],['sg-x','sgX'],['sg-f','sgF']].map(([c,k])=>`<span><i class="tag ${c}">&nbsp;</i>${T(k)}</span>`).join('');
  try{
    const raw=$('hexin').value.trim().toLowerCase().replace(/\s+/g,'');
    const u=fromHex(raw);if(u.length<85)throw new Error('< 85 B');
    const dv=new DataView(u.buffer);
    const hd=u.slice(0,80);
    const ntx=dv.getUint32(80,true);
    let o=84;const[hc,hl]=readVarint(u,o);const segs=[['sg-h',0,80],['sg-n',80,84],['sg-c',o,o+hl]];o+=hl;
    const hashes=[];for(let i=0;i<hc;i++){if(o+32>u.length)throw new Error('hash '+(i+1));hashes.push(u.slice(o,o+32));segs.push([i%2?'sg-x2':'sg-x',o,o+32]);o+=32;}
    const[fc,fl]=readVarint(u,o);segs.push(['sg-c',o,o+fl]);o+=fl;
    const flagBytes=u.slice(o,o+fc);if(flagBytes.length<fc)throw new Error('flags');segs.push(['sg-f',o,o+fc]);o+=fc;
    view.innerHTML=segs.map(([c,a,b])=>`<span class="${c}">${toHex(u.slice(a,b))}</span>`).join('');
    const bits=[];flagBytes.forEach(b=>{for(let i=0;i<8;i++)bits.push((b>>i)&1);});
    const hdv=new DataView(hd.buffer);
    const rootHdr=toHex(revU(hd.slice(36,68)));
    const time=hdv.getUint32(68,true);
    const rows=[[T('fVer'),hdv.getUint32(0,true)],[T('fPrev'),toHex(revU(hd.slice(4,36)))],[T('fRoot'),rootHdr],[T('fTime'),`${time} → ${new Date(time*1000).toISOString().replace('T',' ').slice(0,19)} UTC`],[T('fBits'),'0x'+hdv.getUint32(72,true).toString(16).padStart(8,'0')],[T('fNonce'),hdv.getUint32(76,true).toLocaleString(LOC())],[T('fHash'),toHex(revU(sha256d(hd)))],[T('fNtx'),ntx],[T('fHc'),hc],[T('fFl'),T('flBits',bits.slice(0,Math.max(1,bits.length)).join(''),toHex(flagBytes))]];
    fields.innerHTML=rows.map(([k,val])=>`<tr><td>${k}</td><td class="mono">${esc(val)}</td></tr>`).join('');
    // traverse (Bitcoin Core CPartialMerkleTree::TraverseAndExtract)
    const width=h=>(ntx+(1<<h)-1)>>h;let height=0;while(width(height)>1)height++;
    let bu=0,hu=0;const matched=[];const li=(html,depth)=>{const x=document.createElement('li');x.style.marginLeft=(depth*18)+'px';x.innerHTML=html;trav.appendChild(x);};
    const walk=(h,p,depth)=>{
      if(bu>=bits.length)throw new Error('bits');const f=bits[bu++];const name=h===height?T('root'):T('nodeName',h,p);
      if(h===0||!f){if(hu>=hashes.length)throw new Error('hashes');const hh=hashes[hu++];const disp=short(toHex(revU(hh)));
        if(h===0&&f){matched.push(toHex(revU(hh)));li(T('tvMatch',name,disp),depth);}else li(T('tvHash',name,f,disp),depth);return hh;}
      li(T('tvIn',name,f),depth);
      const L=walk(h-1,p*2,depth+1);let Rr;
      if(p*2+1<width(h-1))Rr=walk(h-1,p*2+1,depth+1);else{Rr=L;li(T('tvDup',T('nodeName',h-1,p*2+1)),depth+1);}
      const out=sha256d(cat(L,Rr));li(T('tvCombine',name,short(toHex(revU(out)))),depth);return out;};
    const root=toHex(revU(walk(height,0,0)));
    if(root===rootHdr){v.className='verdict ok';v.textContent=T('hOk',matched.join(', '));}else{v.className='verdict bad';v.textContent=T('hBad')+' ('+short(root)+' ≠ '+short(rootHdr)+')';}
  }catch(e){v.className='verdict bad';v.textContent=T('hErr',e.message);}
}
$('hexin').addEventListener('input',renderHex);

/* ---------- exercises ---------- */
function renderEx(){
  const box=$('exercises');box.innerHTML='';
  EXS[lang].forEach((x,i)=>{
    const d=document.createElement('div');d.className='ex';
    d.innerHTML=`<div class="q">${i+1}. ${x.q}</div><div class="row"></div><div class="fb" aria-live="polite"></div><div class="sol" hidden>${x.sol}</div>`;
    const row=d.querySelector('.row'),fb=d.querySelector('.fb'),sol=d.querySelector('.sol');
    if(x.type==='choice'){x.choices.forEach((c,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=c;
      b.onclick=()=>{row.querySelectorAll('.choice').forEach(z=>z.classList.remove('right','wrong'));
        if(j===x.ans){b.classList.add('right');fb.className='fb ok';fb.textContent=T('right');sol.hidden=false;}
        else{b.classList.add('wrong');fb.className='fb bad';fb.textContent=T('wrong');}};row.appendChild(b);});}
    else{const inp=document.createElement('input');inp.type='text';inp.inputMode='numeric';inp.id='ex'+i;inp.setAttribute('aria-label',T('ansL')+' '+(i+1));
      const b=document.createElement('button');b.className='btn';b.textContent=T('check');
      const check=()=>{if(inp.value.trim()===''){fb.className='fb bad';fb.textContent=T('empty');return;}
        const v=Number(inp.value.replace(/[.,\s]/g,''));
        if(v===x.ans){fb.className='fb ok';fb.textContent=T('right');sol.hidden=false;}else{fb.className='fb bad';fb.textContent=T('wrong');}};
      b.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});row.append(inp,b);}
    const s=document.createElement('button');s.className='btn';s.textContent=T('showSol');s.onclick=()=>{sol.hidden=false;};row.appendChild(s);
    box.appendChild(d);});
}

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.innerHTML=T(e.dataset.i18n);});
  document.querySelectorAll('#langseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  render();renderScale();renderJson();renderHex();renderEx();
}
document.querySelectorAll('#langseg button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('merkle-lang',lang);}catch(e){}applyLang();}));
applyLang();
