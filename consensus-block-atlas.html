<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Uzlaşma Blok Atlası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single long ledger. Each mechanism is one "block" of the page: animated stage + block anatomy + a chain strip that keeps growing; the feed loops forever. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface2:#e4eaef; --ink:#0f2433; --muted:#566b7a; --line:#c9d4dc;
  --cyan:#1386c4; --cyan-soft:#d6ebf6; --amber:#d98a00; --amber-soft:#fbecc9; --good:#1f8a5b; --bad:#c8433a;
  --f-disp:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1820; --surface:#11232e; --surface2:#183140; --ink:#e2edf3; --muted:#8fa6b4; --line:#26404f;
  --cyan:#4fb6ea; --cyan-soft:#143a50; --amber:#f2b33d; --amber-soft:#3d3115; --good:#45c08a; --bad:#ef6b61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1820; --surface:#11232e; --surface2:#183140; --ink:#e2edf3; --muted:#8fa6b4; --line:#26404f;
  --cyan:#4fb6ea; --cyan-soft:#143a50; --amber:#f2b33d; --amber-soft:#3d3115; --good:#45c08a; --bad:#ef6b61; color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--f-disp);font-weight:800;font-stretch:112%;letter-spacing:.02em;font-size:15px;white-space:nowrap;text-transform:uppercase}
.brand span{color:var(--cyan)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{font-family:var(--f-mono);font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:4px;text-decoration:none;color:var(--muted);white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ctl{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--cyan-soft);border-color:var(--cyan)}
select.btn{padding-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:500 12.5px var(--f-mono);background:var(--surface);color:var(--muted);border:0;padding:5px 9px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
.inner{max-width:1240px;margin:0 auto}

.intro{padding-block:44px 28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-disp);font-weight:800;font-stretch:112%;font-size:clamp(30px,4.6vw,54px);line-height:1.02;margin:10px 0 14px;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--cyan)}
.intro p{margin:0;max-width:62ch;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:14px 16px}
.legend b{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);grid-column:1/-1}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px}

.mech{border-top:2px solid var(--ink);padding-block:26px 34px;scroll-margin-top:70px}
.mhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 28px;align-items:end;margin-bottom:18px}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.tag b{color:var(--cyan);font-weight:500}
h2{font-family:var(--f-disp);font-weight:800;font-stretch:112%;font-size:clamp(24px,3.2vw,36px);line-height:1.05;margin:4px 0 6px;text-wrap:balance}
h2 .ab{color:var(--cyan)}
h2 .tr{display:block;font-family:var(--f-body);font-weight:500;font-stretch:100%;font-size:16px;color:var(--muted);margin-top:4px}
.proof{margin:0;font-size:15px}
.proof b{font-weight:600}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,auto));gap:0;margin:0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.meta div{padding:8px 14px;border-left:1px solid var(--line);min-width:0}
.meta div:first-child{border-left:0}
.meta dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:2px 0 0;font-size:13.5px;font-weight:500}

.grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:18px;align-items:start}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stage canvas{display:block;width:100%;height:360px}
.cap{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.cap .now{min-width:0}
.cap .now b{font-family:var(--f-mono);font-weight:500;color:var(--cyan);margin-right:8px}
.cap .btns{display:flex;gap:6px;flex-shrink:0}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 8px;padding:7px 10px;border-radius:5px;position:relative;cursor:pointer}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;color:var(--muted);grid-row:1/3;padding-top:2px}
.steps li b{font-weight:500;font-size:14px}
.steps li span{display:none;font-size:13.5px;color:var(--muted);grid-column:2}
.steps li.on{background:var(--surface)}
.steps li.on::before{color:var(--cyan)}
.steps li.on b{font-weight:600}
.steps li.on span{display:block}
.steps li.done b{color:var(--muted)}
.steps .pg{position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--cyan);transform-origin:left;transform:scaleX(0)}
.steps li:not(.on) .pg{display:none}

.block{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.bh strong{font-family:var(--f-disp);font-weight:800;font-stretch:112%;font-size:18px;font-variant-numeric:tabular-nums}
.bh small{font-size:12px;color:var(--muted)}
.part{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface2);padding:5px 14px}
.row{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:0 10px;padding:7px 14px;border-top:1px solid var(--line);transition:background .25s}
.part+.row{border-top:0}
.row .k{font-family:var(--f-mono);font-size:12px;color:var(--ink);overflow-wrap:anywhere}
.row .v{font-family:var(--f-mono);font-size:12px;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .n{grid-column:1/-1;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.row.hl{background:var(--amber-soft)}
.row.hl .v{color:var(--ink)}
.row.flash .v{animation:fl 1s ease}
@keyframes fl{0%{background:var(--amber-soft)}100%{background:transparent}}

.chainwrap{margin-top:18px}
.chainlbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.chain{display:flex;gap:0;overflow:hidden;justify-content:flex-end;padding-block:2px;mask-image:linear-gradient(90deg,transparent,#000 12%)}
.mini{flex:0 0 auto;display:flex;align-items:center}
.mini .lk{width:22px;height:2px;background:var(--line);position:relative}
.mini .lk::before{content:"";position:absolute;left:-1px;top:-3px;border:4px solid transparent;border-right-color:var(--line);border-left:0}
.mini .bx{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 10px;min-width:118px}
.mini .bx .h{font-family:var(--f-mono);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.mini .bx .x{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mini .bx .p{font-size:11.5px;color:var(--muted)}
.mini.new .bx{border-color:var(--amber);background:var(--amber-soft)}
.mini.enter{animation:slin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes slin{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}

.loop{margin-block:10px 0;padding:22px 0;border-top:2px dashed var(--line);text-align:center;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.loop b{color:var(--cyan);font-weight:500}
.note{font-size:12.5px;color:var(--muted);margin-top:24px}

@media (max-width:920px){
  .intro{grid-template-columns:minmax(0,1fr);gap:20px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .mhead{grid-template-columns:minmax(0,1fr)}
  .meta{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:560px){
  .stage canvas{height:300px}
  .meta{grid-template-columns:minmax(0,1fr)}
  .meta div{border-left:0;border-top:1px solid var(--line)}
  .meta div:first-child{border-top:0}
  .bar-in{flex-wrap:wrap;row-gap:8px}
  .mech{scroll-margin-top:140px}
  .chips{order:3;flex-basis:100%}
  .brand{margin-right:auto}
  .ctl{flex-basis:100%}
  .ctl .btn#gplay{flex:1}
  .cap{flex-direction:column;align-items:stretch}
  .row{grid-template-columns:minmax(0,1fr)}
  .legend{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.mini.enter,.row.flash .v{animation:none}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand" data-i18n="brand"></div>
    <nav class="chips" id="chips" aria-label="Mechanisms / Mekanizmalar"></nav>
    <div class="ctl">
      <div class="seg" id="langseg" role="group" aria-label="Language / Dil">
        <button type="button" data-lang="tr" aria-pressed="true">TR</button><button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="btn" id="gplay" type="button" aria-pressed="false"></button>
      <select class="btn" id="speed" aria-label="Speed / Hız">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>
      </select>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="inner">
    <section class="intro">
      <div>
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1 data-i18n="h1"></h1>
        <p data-i18n="intro"></p>
      </div>
      <div class="legend">
        <b data-i18n="lgH"></b>
        <div><i class="sw" style="background:var(--cyan)"></i><span data-i18n="lg1"></span></div>
        <div><i class="sw" style="background:var(--amber)"></i><span data-i18n="lg2"></span></div>
        <div><i class="sw" style="background:var(--good)"></i><span data-i18n="lg3"></span></div>
        <div><i class="sw" style="background:var(--bad)"></i><span data-i18n="lg4"></span></div>
      </div>
    </section>
    <div id="feed"></div>
    <div class="loop" id="sentinel"></div>
    <p class="note" data-i18n="note"></p>
  </div>
</main>

<script>
(()=>{
/* ---------- AYAR / SETTING ----------
   LOOP = true  → sayfa sonunda mekanizmalar yeni turla baştan eklenir (sonsuz kaydırma)
   LOOP = false → sayfa DAG bölümünde biter */
const LOOP=true;

/* ---------- language ---------- */
let lang='tr';try{const s=localStorage.getItem('atlas-lang');if(s==='en'||s==='tr')lang=s}catch(e){}
const L=(tr,en)=>lang==='en'?en:tr;
const B=(tr,en)=>({tr,en});
const X=v=>v&&typeof v==='object'&&'tr' in v?v[lang]:v;
const UI={
 brand:B('Uzlaşma <span>Blok Atlası</span>','Consensus <span>Block Atlas</span>'),
 eyebrow:B('SENG433 · Hafta 4 · Uzlaşma Mekanizmaları','SENG433 · Week 4 · Consensus Mechanisms'),
 h1:B('Bir blok zincire <em>nasıl</em> eklenir?','<em>How</em> does a block join the chain?'),
 intro:B('Her bölüm bir uzlaşma mekanizmasını canlı çalıştırır. Solda bloğun eklenme akışı adım adım oynar, sağda o mekanizmaya ait bloğun alanları görünür ve o adımda değişen alanlar vurgulanır. Altındaki şerit, eklenen her blokla uzar. Sayfa sonuna geldiğinizde zincir yeni bir turla devam eder.',
   'Each section runs one consensus mechanism live. On the left, the block-append workflow plays step by step; on the right, you see the fields of that mechanism’s block, with the fields touched in the current step highlighted. The strip below grows with every appended block. When you reach the end of the page, the chain continues with a new round.'),
 lgH:B('Renk anahtarı','Colour key'),lg1:B('Mesaj, işlem, akış','Message, transaction, flow'),lg2:B('Seçilen / kazanan','Selected / winner'),lg3:B('Onay, doğrulama','Confirmation, validation'),lg4:B('Hatalı ya da reddedilen','Faulty or rejected'),
 note:B('Blok numaraları, hash’ler ve adresler eğitim amaçlı örnek değerlerdir. Akışlar sadeleştirilmiştir; ayrıntılar için haftanın okuması: Zhang &amp; Lee (2019), ICT Express.',
   'Block numbers, hashes and addresses are example values for teaching. Workflows are simplified; for details see this week’s reading: Zhang &amp; Lee (2019), ICT Express.'),
 pauseAll:B('Tümünü duraklat','Pause all'),playAll:B('Tümünü oynat','Play all'),
 pause:B('Duraklat','Pause'),play:B('Oynat','Play'),prev:B('Önceki adım','Previous step'),next:B('Sonraki adım','Next step'),
 round:B('tur','round'),proof:B('Kanıt =','Proof ='),head:B('Başlık · header','Header'),body:B('Gövde · body','Body'),
 chainB:B('Zincir · eklenen bloklar','Chain · appended blocks'),chainT:B('Zincir · onaylanan işlemler','Tangle · attached transactions'),
 added:B('bu bölümde +','+'),addedSfx:B('',' in this section'),anim:B('blok ekleme animasyonu','block-append animation'),
 loop:B('Zincir devam ediyor · <b>tur {n} yükleniyor</b>','The chain continues · <b>loading round {n}</b>'),
 end:B('Sayfanın sonu · <b>animasyonlar her bölümde çalışmaya devam ediyor</b>','End of page · <b>animations keep running in every section</b>'),
 title:B('Uzlaşma Blok Atlası','Consensus Block Atlas')
};
const U=k=>X(UI[k]);

const TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const HEX='0123456789abcdef', B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
const hex=n=>{let s='';for(let i=0;i<n;i++)s+=HEX[Math.random()*16|0];return s};
const b58=n=>{let s='';for(let i=0;i<n;i++)s+=B58[Math.random()*58|0];return s};
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function hi(n){n=(n^61)^(n>>>16);n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return n>>>0}
const hx=(seed,len)=>{let s='',x=seed>>>0;for(let i=0;i<len;i++){x=hi(x+i*7919+1);s+=HEX[x&15]}return s};
const short=h=>h.length>14?h.slice(0,8)+'…'+h.slice(-4):h;
const nf=n=>Number(n).toLocaleString(lang==='en'?'en-US':'tr-TR');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- theme colors for canvas ---------- */
let C={};
function readColors(){const cs=getComputedStyle(document.documentElement);
  for(const k of ['bg','surface','surface2','ink','muted','line','cyan','cyan-soft','amber','amber-soft','good','bad'])
    C[k.replace('-soft','Soft')]=cs.getPropertyValue('--'+k).trim();}
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});

/* ---------- drawing helpers ---------- */
const FAM={sans:'"IBM Plex Sans", system-ui, sans-serif',mono:'"IBM Plex Mono", ui-monospace, monospace',disp:'"Archivo", "IBM Plex Sans", sans-serif'};
function mk(ctx){
  const rr=(x,y,w,h,r)=>{ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)};
  const D={
    ctx,
    circle(x,y,r,fill,stroke,lw=1.5){ctx.beginPath();ctx.arc(x,y,Math.max(r,0),0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}},
    rect(x,y,w,h,r,fill,stroke,lw=1.5,dash){rr(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.setLineDash(dash||[]);ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();ctx.setLineDash([])}},
    text(s,x,y,o={}){ctx.font=`${o.weight||500} ${o.size||12}px ${FAM[o.fam||'sans']}`;ctx.fillStyle=o.color||C.ink;ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.fillText(s,x,y);ctx.globalAlpha=1},
    line(x1,y1,x2,y2,color,lw=1,dash){ctx.beginPath();ctx.setLineDash(dash||[]);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke();ctx.setLineDash([])},
    arrow(x1,y1,x2,y2,color,lw=1.5,hd=7,dash){D.line(x1,y1,x2,y2,color,lw,dash);const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hd*Math.cos(a-.42),y2-hd*Math.sin(a-.42));ctx.lineTo(x2-hd*Math.cos(a+.42),y2-hd*Math.sin(a+.42));ctx.closePath();ctx.fillStyle=color;ctx.fill()},
    partial(x1,y1,x2,y2,t,color,lw=1.5,dash){if(t<=0)return;const e=clamp(t);const x=lerp(x1,x2,e),y=lerp(y1,y2,e);if(e>=1)D.arrow(x1,y1,x2,y2,color,lw,6,dash);else{D.line(x1,y1,x,y,color,lw,dash);D.circle(x,y,3.6,color)}},
    packet(x1,y1,x2,y2,t,color,r=4){if(t<=0||t>=1)return;const e=ease(t);D.circle(lerp(x1,x2,e),lerp(y1,y2,e),r,color)},

MECHS.forEach(m=>{const a=document.createElement('a');a.className='chip';a.href='#'+m.id;a.textContent=m.ab;a.dataset.id=m.id;chips.appendChild(a)});

function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}

function headHTML(I){const m=I.mech;return `<div>
    <div class="tag"><b>${String(I.idx+1).padStart(2,'0')}</b> / ${MECHS.length} · ${U('round')} ${I.round} · ${esc(m.ab)}</div>
    <h2><span class="ab">${esc(m.ab)}</span> · ${esc(m.name)}<span class="tr">${esc(X(m.tr))}</span></h2>
    <p class="proof"><b>${U('proof')}</b> ${esc(X(m.proof))}</p></div>
    <dl class="meta">${m.meta.map(([a,b])=>`<div><dt>${esc(X(a))}</dt><dd>${esc(X(b))}</dd></div>`).join('')}</dl>`}

function build(m,idx,r){
  const sec=document.createElement('section');sec.className='mech';sec.id=r===1?m.id:m.id+'-'+r;sec.dataset.mid=m.id;
  sec.innerHTML=`
  <div class="mhead"></div>
  <div class="grid">
    <div>
      <div class="stage"><canvas role="img"></canvas>
        <div class="cap"><div class="now"><b class="sn"></b><span class="st"></span></div>
          <div class="btns"><button class="btn prev" type="button">◀</button><button class="btn play" type="button"></button><button class="btn next" type="button">▶</button></div></div></div>
      <ol class="steps">${m.steps.map(()=>`<li><b></b><span></span><i class="pg"></i></li>`).join('')}</ol>
    </div>
    <aside class="block"><div class="bh"><strong class="bt"></strong><small class="bs"></small></div><div class="rows"></div></aside>
  </div>
  <div class="chainwrap"><div class="chainlbl"><span class="cl"></span><span class="cnt"></span></div><div class="chain"></div></div>`;
  feed.appendChild(sec);
  const H=heights[m.id];
  if(m.mem&&!mems[m.id])mems[m.id]=m.mem();
  const I={m:mems[m.id]||{},mech:m,idx,sec,canvas:sec.querySelector('canvas'),step:0,el:0,clock:0,playing:!reduce,visible:false,added:0,round:r,minis:[],
    get height(){return H.h+1},get prev(){return H.prev},get ts(){return H.ts}};
  I.ctx=I.canvas.getContext('2d');I.D=mk(I.ctx);
  I.c=m.init(I);
  I.lis=[...sec.querySelectorAll('.steps li')];I.sn=sec.querySelector('.sn');I.st=sec.querySelector('.st');I.rows=sec.querySelector('.rows');I.bt=sec.querySelector('.bt');I.chain=sec.querySelector('.chain');I.cnt=sec.querySelector('.cnt');I.playBtn=sec.querySelector('.play');
  I.lis.forEach((li,k)=>li.addEventListener('click',()=>{I.step=k;I.el=0;syncSteps(I)}));
  sec.querySelector('.prev').onclick=()=>{I.step=Math.max(0,I.step-1);I.el=0;syncSteps(I)};
  sec.querySelector('.next').onclick=()=>advanceStep(I);
  I.playBtn.onclick=()=>{I.playing=!I.playing;labelSection(I)};
  for(let k=5;k>=1;k--)I.minis.push({h:H.h-k,hash:hex(64),c:k===1?I.c:null});
  if(reduce){I.step=Math.min(2,m.steps.length-1);I.el=m.steps[I.step].dur*.6}
  labelSection(I);renderChain(I,false);
  io.observe(sec);ro.observe(I.canvas);sizeCanvas(I);
  inst.push(I);
}
function labelSection(I){const m=I.mech,sec=I.sec;
  sec.querySelector('.mhead').innerHTML=headHTML(I);
  I.lis.forEach((li,k)=>{li.querySelector('b').textContent=X(m.steps[k].t);li.querySelector('span').textContent=X(m.steps[k].d)});
  I.canvas.setAttribute('aria-label',m.name+' · '+U('anim'));
  sec.querySelector('.prev').setAttribute('aria-label',U('prev'));sec.querySelector('.next').setAttribute('aria-label',U('next'));
  I.playBtn.textContent=I.playing?U('pause'):U('play');
  sec.querySelector('.bs').textContent=X(m.struct);
  sec.querySelector('.cl').textContent=m.id==='dag'?U('chainT'):U('chainB');
  renderCard(I,false);syncSteps(I);counter(I)}
function counter(I){I.cnt.textContent=I.added?U('added')+I.added+U('addedSfx'):''}
function renderChain(I,animLast){const m=I.mech;
  I.chain.innerHTML=I.minis.map((x,i)=>{const last=i===I.minis.length-1&&animLast;
    let prod='';try{prod=x.c?m.producer(x.c,x.h):''}catch(e){}
    return `<div class="mini${last?' new enter':''}"><div class="lk"></div><div class="bx"><div class="h">${esc(X(m.unit))} ${nf(x.h)}</div><div class="x">${esc(short(x.hash))}</div><div class="p">${esc(prod)}</div></div></div>`}).join('')}
function renderCard(I,flash){
  const m=I.mech,f=m.fields(I.c,I,I.height);I.bt.textContent=X(m.unit)+' #'+nf(I.height);
  const old={};I.rows.querySelectorAll('.row').forEach(r=>old[r.dataset.k]=r.querySelector('.v').textContent);
  const row=([k,l,v,n])=>`<div class="row${flash&&old[k]!==undefined&&old[k]!==String(v)?' flash':''}" data-k="${esc(k)}"><code class="k">${esc(l)}</code><code class="v" title="${esc(v)}">${esc(v)}</code><span class="n">${esc(n)}</span></div>`;
  I.rows.innerHTML=`<div class="part">${U('head')}</div>${f.head.map(row).join('')}<div class="part">${U('body')}</div>${f.body.map(row).join('')}`;
  hlRows(I)}
function hlRows(I){const hl=I.mech.steps[I.step].hl||[];I.rows.querySelectorAll('.row').forEach(r=>r.classList.toggle('hl',hl.includes(r.dataset.k)))}
function syncSteps(I){const m=I.mech;I.lis.forEach((li,k)=>{li.classList.toggle('on',k===I.step);li.classList.toggle('done',k<I.step)});
  I.sn.textContent=(I.step+1)+'/'+m.steps.length;I.st.textContent=X(m.steps[I.step].t);hlRows(I)}
function advanceStep(I){const m=I.mech;I.el=0;I.step++;if(I.step>=m.steps.length){I.step=0;completeCycle(I)}syncSteps(I)}
function completeCycle(I){const m=I.mech,H=heights[m.id];
  if(m.complete)m.complete(I,I.c);
  const hgt=H.h+1;I.minis.push({h:hgt,hash:I.c.hash,c:I.c});if(I.minis.length>9)I.minis.shift();
  H.h=hgt;H.prev=I.c.hash;H.ts+=Math.max(1,Math.round(m.dt));I.added++;counter(I);
  renderChain(I,!reduce);I.c=m.init(I);renderCard(I,true)}

/* ---------- sizing, visibility ---------- */
function sizeCanvas(I){const r=I.canvas.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);
  I.w=Math.max(1,r.width);I.h=Math.max(1,r.height);I.canvas.width=Math.round(I.w*dpr);I.canvas.height=Math.round(I.h*dpr);I.dpr=dpr;draw(I)}
const ro=new ResizeObserver(es=>es.forEach(e=>{const I=inst.find(x=>x.canvas===e.target);if(I)sizeCanvas(I)}));
const io=new IntersectionObserver(es=>es.forEach(e=>{const I=inst.find(x=>x.sec===e.target);if(I){I.visible=e.isIntersecting;if(I.visible)draw(I)}}),{rootMargin:'120px 0px'});

function draw(I){const{ctx}=I;if(!I.w)return;ctx.setTransform(I.dpr,0,0,I.dpr,0,0);ctx.clearRect(0,0,I.w,I.h);
  const st=I.mech.steps[I.step];const t=clamp(I.el/st.dur);
  try{I.mech.draw({D:I.D,w:I.w,h:I.h,s:clamp(I.w/760,.55,1.15),step:I.step,t,c:I.c,m:I.m,clock:I.clock,height:I.height})}catch(err){console.error(I.mech.id,err)}
  const pg=I.lis[I.step]&&I.lis[I.step].querySelector('.pg');if(pg)pg.style.transform='scaleX('+t+')'}

let last=performance.now();
function frame(now){const dt=Math.min(80,now-last);last=now;
  for(const I of inst){if(!I.visible)continue;
    if(I.playing&&!gPaused){I.clock+=dt*speed;I.el+=dt*speed;if(I.el>=I.mech.steps[I.step].dur)advanceStep(I)}
    draw(I)}
  requestAnimationFrame(frame)}

/* ---------- infinite feed ---------- */
const sentinel=document.getElementById('sentinel');
function loopLabel(){sentinel.innerHTML=LOOP?U('loop').replace('{n}',round+1):U('end')}
function addRound(){round++;MECHS.forEach((m,i)=>build(m,i,round));loopLabel()}
addRound();
if(LOOP)new IntersectionObserver(es=>{if(es[0].isIntersecting)addRound()},{rootMargin:'600px 0px'}).observe(sentinel);

/* active chip */
const cio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const id=e.target.dataset.mid;chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id));
  const on=chips.querySelector('.chip.on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'})}}),{rootMargin:'-45% 0px -50% 0px'});
new MutationObserver(()=>document.querySelectorAll('.mech:not([data-co])').forEach(s=>{s.dataset.co=1;cio.observe(s)})).observe(feed,{childList:true});
document.querySelectorAll('.mech').forEach(s=>{s.dataset.co=1;cio.observe(s)});

/* global controls + language */
const gp=document.getElementById('gplay');
function gLabel(){gp.textContent=gPaused?U('playAll'):U('pauseAll')}
gp.onclick=()=>{gPaused=!gPaused;gp.setAttribute('aria-pressed',String(gPaused));gLabel()};
document.getElementById('speed').onchange=e=>{speed=parseFloat(e.target.value)||1};
function applyLang(){
  document.documentElement.lang=lang;document.title=U('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.innerHTML=U(e.dataset.i18n)});
  document.querySelectorAll('#langseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  gLabel();loopLabel();inst.forEach(I=>{labelSection(I);renderChain(I,false);draw(I)})}
document.querySelectorAll('#langseg button').forEach(b=>b.addEventListener('click',()=>{if(lang===b.dataset.lang)return;lang=b.dataset.lang;try{localStorage.setItem('atlas-lang',lang)}catch(e){}applyLang()}));
applyLang();
document.fonts&&document.fonts.ready.then(()=>inst.forEach(draw));
requestAnimationFrame(frame);
})();
</script>

</body></html>
